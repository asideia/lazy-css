name: 🚀 Lazy CSS - Production Build & Release

# Trigger the workflow automatically when a version tag (e.g., v1.0.4) is pushed
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create GitHub Releases and upload assets
    
    steps:
      # 1. Checkout the repository code into the runner
      - name: 📂 Checkout codebase
        uses: actions/checkout@v4

      # 2. Setup the Node.js runtime environment
      - name: 🟢 Setup Node.js env
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install development dependencies using clean install (npm ci)
      - name: 📦 Install ecosystem dependencies
        run: npm ci

      # 4. Compile core CSS modules and build AI Specs/Blueprints
      - name: ⚡ Compile Lazy CSS artifacts
        run: npm run build

      # 5. Create an automated GitHub Release and attach all updated production assets
      - name: 🏆 Generate automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lazycss.min.css
            dist/lazycss.spec.json
            dist/lazycss-blueprint.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}