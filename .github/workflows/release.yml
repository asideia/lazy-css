name: 🚀 Lazy CSS - Production Build & Release

# Trigger the workflow automatically when a version tag (e.g., v1.0.4) is pushed
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create GitHub Releases and upload assets

    steps:
      # 1. Checkout the repository code into the runner
      - name: 📂 Checkout codebase
        uses: actions/checkout@v4

      # 2. Setup the Node.js runtime environment with caching enabled
      - name: 🟢 Setup Node.js env
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install all dependencies including devDependencies explicitly
      - name: 📦 Install ecosystem dependencies
        run: npm ci --include=dev

      # 4. Compile core CSS modules and build AI Specs/Blueprints
      - name: ⚡ Compile Lazy CSS artifacts (Step by Step)
        run: |
          node --version
          npm run build-spec || echo "build-spec failed"
          npm run build-min || echo "build-min failed"
          npm run build-blueprint || echo "build-blueprint failed"
          ls -la
          ls -la dist/ || echo "Directory dist does not exist"

      # 5. Verify build outputs exist before proceeding to release
      - name: 🔍 Verify build artifacts
        run: |
          ls -la dist/
          test -f dist/lazycss.min.css || { echo "Missing dist/lazycss.min.css"; exit 1; }
          test -f dist/lazycss.spec.json || { echo "Missing dist/lazycss.spec.json"; exit 1; }
          test -f dist/lazycss-blueprint.md || { echo "Missing dist/lazycss-blueprint.md"; exit 1; }

      # 6. Create an automated GitHub Release and attach production assets
      - name: 🏆 Generate automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lazycss.min.css
            dist/lazycss.spec.json
            dist/lazycss-blueprint.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
