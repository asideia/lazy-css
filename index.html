<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Vibe CSS — Playground Dinâmico</title>
  
  <link rel="stylesheet" href="./dist/vibe.min.css">

  <style>
    /* Estilos de apoio exclusivos do Playground */
    .play-section {
      margin-bottom: 3.5rem;
      padding-bottom: 2.5rem;
      border-bottom: 2px dashed var(--border-color);
    }
    .play-title {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .preview-box {
      padding: 1.5rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
    }
    .code-inspector {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: var(--radius-md);
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }
    .code-inspector summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--color-primary);
      user-select: none;
      padding: 0.5rem 0;
    }
    .code-inspector pre {
      margin-top: 1rem;
      padding: 1rem;
      background: #11111b;
      border-radius: var(--radius-md);
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
    }
    /* Posicionamento do wrapper de código */
    .code-wrapper {
      position: relative;
      margin-top: 1rem;
    }
    
    .code-inspector pre {
      margin-top: 0; /* Resetado pois o wrapper agora segura o espaçamento */
      padding: 1.25rem;
      background: #11111b;
      border-radius: var(--radius-md);
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Estilização do Botão de Copiar */
    .vibe-copy-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      color: #cdd6f4;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: calc(var(--radius-md) * 0.75);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .vibe-copy-btn:hover {
      background: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
    }

    /* Estado quando o código for copiado com sucesso */
    .vibe-copy-btn.copied {
      background: hsl(var(--vibe-success-raw) / 0.2);
      color: #00ff66;
      border-color: hsl(var(--vibe-success-raw) / 0.4);
    }
  </style>
</head>
<body>

  <header class="vibe-row" style="background: var(--bg-surface); padding: 1.5rem; border-bottom: 1px solid var(--border-color); justify-content: space-between;">
    <h1 class="vibe-text-main" style="font-size: 1.8rem; margin: 0;">🌊 Vibe CSS <span style="font-size: 1rem; color: var(--color-primary);">Playground Dinâmico</span></h1>
    <span id="vibe-status-badge" style="font-weight: 600; color: #666; transition: color 0.3s ease;">Verificando Vibe...</span>
  </header>

  <main id="vibe-dynamic-content" class="vibe-container" style="padding: 2rem 1.5rem;">
    </main>

  <footer class="vibe-text-muted" style="text-align: center; padding: 3rem 0; font-size: 0.85rem; border-top: 1px solid var(--border-color);">
    Vibe CSS &copy; 2026 — Desenvolvido em fluxo dinâmico de engenharia.
  </footer>

  <script src="./assets/playground.js"></script>
  <script>
    // Validador de status do CSS compilado
    document.addEventListener("DOMContentLoaded", () => {
      const badge = document.getElementById("vibe-status-badge");
      const isVibeActive = getComputedStyle(document.documentElement).getPropertyValue('--vibe-primary-raw').trim() !== "";
      if (isVibeActive) {
        badge.innerHTML = "Modo: 🛠️ Vibe Coding Ativo";
        badge.style.color = "var(--color-primary)";
      } else {
        badge.innerHTML = "Modo: ⚠️ Vibe Coding Inativo (CSS offline)";
        badge.style.color = "var(--color-danger)";
      }
    });
  </script>
</body>
</html>
